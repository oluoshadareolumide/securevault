# nginx/nginx.conf — Reverse proxy for SecureVault
# Routes /api/* → backend:4000, /* → frontend:80

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    # Uncomment when you have SSL certs:
    # return 301 https://$host$request_uri;

    client_max_body_size 100G;   # Match your max upload size

    # ── Frontend ──────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Backend API ───────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large file uploads
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
    }

    # ── File downloads ────────────────────────────────
    location /uploads/ {
        proxy_pass         http://backend:4000/uploads/;
        proxy_http_version 1.1;
    }
}

